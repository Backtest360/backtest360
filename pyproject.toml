[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "backtest360"
dynamic = ["version"]
description = "Official Python client for the Backtest360 API"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Backtest360", email = "hello@backtest360.com"},
]
requires-python = ">=3.9"
keywords = [
    "backtesting",
    "trading",
    "quantitative-finance",
    "algorithmic-trading",
    "finance",
    "investment",
    "trading-strategy",
    "api-client",
    "pandas",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pandas>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.urls]
Homepage = "https://backtest360.com"
Repository = "https://github.com/Backtest360/backtest360"
"API Reference" = "https://api.backtest360.com/docs"
Changelog = "https://github.com/Backtest360/backtest360/blob/main/CHANGELOG.md"
Issues = "https://github.com/Backtest360/backtest360/issues"

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/backtest360"]
artifacts = ["src/backtest360/py.typed"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "examples/",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]
